name: Build and Push

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging]

env:
  REGISTRY: harbor.10.0.0.200.nip.io
  IMAGE: harbor.10.0.0.200.nip.io/library/rag-eval

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          BRANCH=${GITHUB_REF_NAME}
          if [ "$BRANCH" = "main" ]; then
            TAG="${SHA}"
          else
            TAG="${BRANCH}-${SHA}"
          fi
          echo "tag=${TAG}"       >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      - name: Connect to Tailscale
        if: github.event_name == 'push'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest

      - name: Trust minicloud CA
        if: github.event_name == 'push'
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ env.REGISTRY }}
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /etc/docker/certs.d/${{ env.REGISTRY }}/ca.crt
          echo "${{ secrets.MINICLOUD_CA_CERT }}" | sudo tee /usr/local/share/ca-certificates/minicloud-ca.crt
          sudo update-ca-certificates

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."harbor.10.0.0.200.nip.io"]
              insecure = true

      - name: Log in to Harbor
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref_name != 'dev'
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        if: github.event_name == 'push' && github.ref_name != 'dev'
        run: |
          cosign sign --yes ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}

      - name: Update gitops image tags (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          NEW_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/andrelair-platform/minicloud-gitops.git
          cd minicloud-gitops
          git config user.name 'AndreLiar'
          git config user.email 'andrelaurelyvan.kanmegnetabouguie@ynov.com'
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import 2>/dev/null || true
          git config commit.gpgsign true
          git config user.signingkey FD6D39D681DEFA34
          sed -i "s|harbor\.10\.0\.0\.200\.nip\.io/library/rag-eval:.*|harbor.10.0.0.200.nip.io/library/rag-eval:${NEW_TAG}|g" \
            manifests/ai/16-rag-eval-job.yaml \
            manifests/ai/17-rag-eval-cronjob.yaml
          git add manifests/ai/16-rag-eval-job.yaml manifests/ai/17-rag-eval-cronjob.yaml
          git diff --cached --quiet || \
            git commit -S -m "ci(rag-eval): bump image to ${NEW_TAG}"
          git push
